   <g id="text_1">
    <text style="fill: #1f3047; font: 700 19px 'DejaVu Sans'; text-anchor: start" x="32.185108" y="33.863143" transform="rotate(-0 32.185108 33.863143)">How the experiment works</text>
   </g>
   <g id="text_2">
    <text style="fill: #1f3047; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="128.456862" y="116.017198" transform="rotate(-0 128.456862 116.017198)">Controlled cases</text>
   </g>
   <g id="text_3">
    <text style="fill: #1f3047; font: 9px 'DejaVu Sans'" transform="translate(94.936783 137.706971)">4 fault families</text>
    <text style="fill: #1f3047; font: 9px 'DejaVu Sans'" transform="translate(86.598424 149.83658)">7 probe conditions</text>
    <text style="fill: #1f3047; font: 9px 'DejaVu Sans'" transform="translate(79.40194 161.96619)">Fault present / absent</text>
   </g>
   <g id="text_4">
    <text style="fill: #1f3047; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="351.944862" y="116.017198" transform="rotate(-0 351.944862 116.017198)">Same public menu</text>
   </g>
   <g id="text_5">
    <text style="fill: #1f3047; font: 9px 'DejaVu Sans'" transform="translate(300.608299 137.706971)">4 inputs × 2 observers</text>
    <text style="fill: #1f3047; font: 9px 'DejaVu Sans'" transform="translate(309.161815 149.83658)">× 2 source choices</text>
    <text style="fill: #1f3047; font: 9px 'DejaVu Sans'" transform="translate(309.590018 161.96619)">3 shared orderings</text>
   </g>
   <g id="text_6">
    <text style="fill: #1f3047; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="575.432862" y="116.017198" transform="rotate(-0 575.432862 116.017198)">Five policies</text>
   </g>
   <g id="text_7">
    <text style="fill: #1f3047; font: 9px 'DejaVu Sans'" transform="translate(530.715518 137.706971)">8 target-call budget</text>
    <text style="fill: #1f3047; font: 9px 'DejaVu Sans'" transform="translate(526.830752 149.83658)">Control triplet costs 3</text>
    <text style="fill: #1f3047; font: 9px 'DejaVu Sans'" transform="translate(533.750205 161.96619)">840 total episodes</text>
   </g>
   <g id="text_8">
    <text style="fill: #1f3047; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="798.920862" y="116.017198" transform="rotate(-0 798.920862 116.017198)">Offline evaluation</text>
   </g>
   <g id="text_9">
    <text style="fill: #1f3047; font: 9px 'DejaVu Sans'" transform="translate(748.710002 137.706971)">Reference replay after</text>
    <text style="fill: #1f3047; font: 9px 'DejaVu Sans'" transform="translate(759.13594 149.83658)">policy completion</text>
    <text style="fill: #1f3047; font: 9px 'DejaVu Sans'" transform="translate(750.796174 161.96619)">Verified discriminator</text>
   </g>
   <g id="text_10">
    <text style="fill: #1f3047; font: 700 15px 'DejaVu Sans'; text-anchor: start" x="32.185108" y="225.174857" transform="rotate(-0 32.185108 225.174857)">Why the calibration trap passes</text>
   </g>
   <g id="text_11">
    <text style="fill: #1f3047; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="128.456862" y="281.345372" transform="rotate(-0 128.456862 281.345372)">Real program</text>
   </g>
   <g id="text_12">
    <text style="fill: #1f3047; font: 9px 'DejaVu Sans'" transform="translate(100.947799 309.142919)">Fault affects</text>
    <text style="fill: #1f3047; font: 9px 'DejaVu Sans'" transform="translate(88.563658 321.272528)">its returned value</text>
   </g>
   <g id="text_13">
    <text style="fill: #1f3047; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="351.944862" y="281.345372" transform="rotate(-0 351.944862 281.345372)">Masking wrapper</text>
   </g>
   <g id="text_14">
    <text style="fill: #1f3047; font: 9px 'DejaVu Sans'" transform="translate(317.712518 309.142919)">Substitutes the</text>
    <text style="fill: #1f3047; font: 9px 'DejaVu Sans'" transform="translate(317.379237 321.272528)">expected value</text>
   </g>
   <g id="text_15">
    <text style="fill: #1f3047; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="575.432862" y="281.388341" transform="rotate(-0 575.432862 281.388341)">Positive control</text>
   </g>
   <g id="text_16">
    <text style="fill: #1f3047; font: 9px 'DejaVu Sans'" transform="translate(536.792627 309.142919)">Overwrites result</text>
    <text style="fill: #1f3047; font: 9px 'DejaVu Sans'" transform="translate(526.245049 321.272528)">with a known sentinel</text>
   </g>
   <g id="text_17">
    <text style="fill: #1f3047; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="798.920862" y="281.388341" transform="rotate(-0 798.920862 281.388341)">Collector</text>
   </g>
   <g id="text_18">
    <text style="fill: #1f3047; font: 9px 'DejaVu Sans'" transform="translate(760.086565 309.142919)">Sees the sentinel</text>
    <text style="fill: #1f3047; font: 9px 'DejaVu Sans'" transform="translate(765.810705 321.272528)">Control passes</text>
   </g>
   <g id="text_19">
    <text style="fill: #875322; font: 10px 'DejaVu Sans'; text-anchor: start" x="32.185108" y="384.060857" transform="rotate(-0 32.185108 384.060857)">The control verifies sensitivity at the collector; it does not establish that the original fault reaches that collector.</text>
   </g>
   <g id="text_20">
    <text style="fill: #5a697e; font: 9px 'DejaVu Sans'; text-anchor: start" x="32.185108" y="435.942" transform="rotate(-0 32.185108 435.942)">Schematic of the frozen v1 study • Supplied menus and explicit specifications • No model-driven discovery or production repair</text>
   </g>
  </g>
 </g>
